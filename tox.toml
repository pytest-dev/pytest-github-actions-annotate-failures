requires = [
    "tox>=4.61",
    "tox-uv",
]
env_list = [
    { product = [
        { prefix = "py3", start = 10 },
        { pytestver = { prefix = "pytest", start = 7, stop = 9 } },
    ] },
]

[env_run_base]
description = "run tests with Python {py_dot_ver} and {factor:pytestver}"
deps = [
    { replace = "if", condition = "factor['pytest9']", then = [
      "pytest>=9.0.0,<10.0.0",
    ], extend = true },
    { replace = "if", condition = "factor['pytest8']", then = [
      "pytest>=8.0.0,<9.0.0",
    ], extend = true },
    { replace = "if", condition = "factor['pytest7']", then = [
      "pytest>=7.0.0,<8.0.0",
      "pytest-rerunfailures<16.2",
    ], extend = true },
]
dependency_groups = ["test"]
commands = [
    [
        "{envpython}",
        "-m",
        "pytest",
        { replace = "posargs", default = [], extend = true },
    ],
]
